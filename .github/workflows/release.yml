name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install npm deps
        run: npm ci

      # Tauri's bundler downloads the AppImage launcher into its cache and
      # saves it with mode 0770. Inside the AppImage every file is owned by
      # root, so wherever permissions are enforced (sandboxes such as firejail,
      # and the AppImage catalog's test) nobody may run it and the app fails
      # with "AppRun.wrapped: Permission denied". The bundler only sets the
      # mode when it downloads the file, so put it there first, runnable by all.
      - name: Prepare the AppImage launcher (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p "$HOME/.cache/tauri"
          curl -fsSL --retry 3 -o "$HOME/.cache/tauri/AppRun-x86_64" \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          chmod 755 "$HOME/.cache/tauri/AppRun-x86_64"

      # tauri.release.conf.json turns on the files the in-app updater needs: a
      # signature beside the AppImage and beside each Windows installer, and
      # the macOS app as a signed .tar.gz. They are signed with the secret
      # TAURI_SIGNING_PRIVATE_KEY, which has to be the key that belongs to
      # plugins.updater.pubkey in tauri.conf.json; the "updater" job below
      # checks that it is. The setting is kept out of tauri.conf.json so that
      # a build on someone's own machine does not need the key.
      # Run with bash on every system: PowerShell takes the "--" for itself.
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build -- --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

      - name: Check the AppImage launcher can be run by anyone (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          APP=$(ls "$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          WORK=$(mktemp -d)
          (cd "$WORK" && "$APP" --appimage-extract 'AppRun*' >/dev/null)
          stat -c '%a %n' "$WORK"/squashfs-root/AppRun*
          for f in "$WORK"/squashfs-root/AppRun "$WORK"/squashfs-root/AppRun.wrapped; do
            [ -e "$f" ] || continue
            case "$(stat -c '%A' "$f")" in
              ???????r?x) ;;
              *) echo "::error::$(basename "$f") inside the AppImage is not readable and runnable by everyone"; exit 1 ;;
            esac
          done
          rm -rf "$WORK"

      # Sign the .rpm so dnf and zypper can check it against
      # packaging/RPM-GPG-KEY-noteriv; zypper refuses an unsigned one unless
      # given --allow-unsigned-rpm. Signed with gpg through rpmsign, not with
      # Tauri's TAURI_SIGNING_RPM_KEY: rpm 4.14 to 4.17 (RHEL 8 and 9) report
      # the signatures Tauri makes as BAD. Requires the secrets RPM_SIGNING_KEY
      # (ASCII-armored private key) and RPM_SIGNING_KEY_PASSPHRASE.
      - name: Sign the RPM (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
          RPM_SIGNING_KEY_PASSPHRASE: ${{ secrets.RPM_SIGNING_KEY_PASSPHRASE }}
        run: |
          if [ -z "$RPM_SIGNING_KEY" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) echo "::error::The RPM_SIGNING_KEY secret is not set, so the release .rpm cannot be signed."; exit 1 ;;
              *) echo "::warning::The RPM_SIGNING_KEY secret is not set; leaving the .rpm unsigned."; exit 0 ;;
            esac
          fi
          export GNUPGHOME="$(mktemp -d)"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$RPM_SIGNING_KEY" | gpg --batch --quiet --import
          KEYID=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^sec/ {print $5; exit}')
          printf '%s' "$RPM_SIGNING_KEY_PASSPHRASE" > "$GNUPGHOME/passphrase"
          DB="$GNUPGHOME/rpmdb"
          rpmkeys --dbpath "$DB" --import ../packaging/RPM-GPG-KEY-noteriv
          for rpm in src-tauri/target/release/bundle/rpm/*.rpm; do
            # The updater build leaves its own signature of the .rpm beside
            # it. It is not used, since the .rpm is not an in-app update, and
            # it has to go: rpmsign has gpg write to that very name, and gpg
            # stops to ask whether to overwrite it, which fails with "cannot
            # open '/dev/tty'".
            rm -f "$rpm.sig"
            rpmsign --addsign \
              --define "__gpg /usr/bin/gpg" \
              --define "_gpg_name $KEYID" \
              --define "_gpg_sign_cmd_extra_args --pinentry-mode loopback --passphrase-file $GNUPGHOME/passphrase" \
              "$rpm"
            # Check against the published public key, so a wrong key in the
            # secret fails the build instead of every install.
            result=$(rpmkeys --dbpath "$DB" --checksig "$rpm" 2>&1) || true
            echo "$result"
            case "$result" in
              *"signatures OK"*) ;;
              *) echo "::error::$(basename "$rpm") is not signed by packaging/RPM-GPG-KEY-noteriv"; exit 1 ;;
            esac
          done

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p ../bundles
          # Linux
          find src-tauri/target/release/bundle/appimage -type f \( -name '*.AppImage' -o -name '*.AppImage.sig' \) -exec cp {} ../bundles/ \; || true
          find src-tauri/target/release/bundle/deb -type f -name '*.deb' -exec cp {} ../bundles/ \; || true
          find src-tauri/target/release/bundle/rpm -type f -name '*.rpm' -exec cp {} ../bundles/ \; || true
          # macOS
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -exec cp {} ../bundles/ \; || true
          # Windows
          find src-tauri/target -type f \( -name '*.msi' -o -name '*.msi.sig' -o -name '*-setup.exe' -o -name '*-setup.exe.sig' \) -exec cp {} ../bundles/ \; || true

      - name: Package Windows portable (lite)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = "src-tauri\target\release\noteriv.exe"
          if (-not (Test-Path $exe)) { throw "noteriv.exe not found at $exe" }
          $stage = Join-Path $env:RUNNER_TEMP "noteriv-portable"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item $exe (Join-Path $stage "noteriv.exe")
          Set-Content -Path (Join-Path $stage "portable.txt") -Value "Marker file. Triggers portable mode: all settings, vaults, and cache stay in this folder."
          @"
          Noteriv $version - Portable

          Run noteriv.exe. All settings and data live in the 'data' folder
          next to the EXE. Auto-updates are disabled in portable builds.
          Delete portable.txt to switch back to standard (AppData) mode.
          "@ | Set-Content -Path (Join-Path $stage "README.txt")
          $zip = "..\bundles\Noteriv-$version-windows-x64-portable.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: bundles/

  # Sideloadable APK built with EAS using the project's stored Android
  # credentials. Requires an EXPO_TOKEN secret; skipped until it is set, and
  # a failure here never blocks the desktop release.
  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: phone
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check for Expo token
        id: token
        working-directory: .
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXPO_TOKEN secret not set; skipping APK build."
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: phone/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.token.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm deps
        if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: Build APK
        if: steps.token.outputs.present == 'true'
        run: |
          VERSION=$(node -p "require('../desktop/package.json').version")
          mkdir -p ../bundles
          npx --yes eas-cli@latest build --platform android --profile apk --local \
            --non-interactive --output "../bundles/Noteriv-${VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        if: steps.token.outputs.present == 'true'
        with:
          name: bundles-android
          path: bundles/

  # Checks every update file against the public key the app carries and writes
  # latest.json, the file an installed copy reads to find an update. A release
  # whose signatures are missing or made with another key cannot be installed
  # from inside the app, which is how every release up to 3.0.1 went out. This
  # job runs on a manual run too, so a rehearsal proves the signatures before a
  # tag needs them.
  updater:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bundles/
          pattern: bundles-*
          merge-multiple: true

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Check the signatures and write latest.json
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) TAG="$GITHUB_REF_NAME" ;;
            *) TAG="v$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")" ;;
          esac
          python3 packaging/updater-manifest.py bundles "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-updater
          path: bundles/latest.json

  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && needs.updater.result == 'success' }}
    needs: [build, updater, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every job's files, with latest.json from the updater job among them.
      - uses: actions/download-artifact@v4
        with:
          path: bundles/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # The .sig files are not published: latest.json carries each
          # signature. The .app.tar.gz is what a macOS copy updates from.
          files: |
            bundles/*.AppImage
            bundles/*.deb
            bundles/*.rpm
            bundles/*.dmg
            bundles/*.app.tar.gz
            bundles/*-setup.exe
            bundles/*.msi
            bundles/Noteriv-*-windows-x64-portable.zip
            bundles/Noteriv-*-android.apk
            bundles/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tell the self-hosted Flatpak repo to rebuild for this version.
      # Requires a PAT secret FLATPAK_DISPATCH_TOKEN (classic, 'repo' scope) and
      # the flatpak repo at thejacedev/flatpak. Safe no-op until set up.
      - name: Trigger Flatpak repo rebuild
        continue-on-error: true
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.FLATPAK_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/thejacedev/flatpak/dispatches" \
            -d "{\"event_type\":\"noteriv-release\",\"client_payload\":{\"version\":\"${GITHUB_REF_NAME#v}\"}}"

      # Tell the Scoop bucket and Homebrew tap to pick up this version now.
      # Both repos also check once a day on their own, so a failure here only
      # delays them. Reuses the Flatpak PAT (classic, 'repo' scope).
      - name: Trigger Scoop bucket and Homebrew tap updates
        continue-on-error: true
        run: |
          for repo in scoop-bucket homebrew-tap; do
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${{ secrets.FLATPAK_DISPATCH_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/thejacedev/${repo}/dispatches" \
              -d "{\"event_type\":\"noteriv-release\",\"client_payload\":{\"version\":\"${GITHUB_REF_NAME#v}\"}}" \
              || echo "::warning::could not ping thejacedev/${repo}"
          done
