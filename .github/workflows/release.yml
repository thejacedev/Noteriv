name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install npm deps
        run: npm ci

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build -- ${{ matrix.args }}

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p ../bundles
          # Linux
          find src-tauri/target/release/bundle/appimage -type f \( -name '*.AppImage' -o -name '*.AppImage.sig' \) -exec cp {} ../bundles/ \; || true
          find src-tauri/target/release/bundle/deb -type f -name '*.deb' -exec cp {} ../bundles/ \; || true
          find src-tauri/target/release/bundle/rpm -type f -name '*.rpm' -exec cp {} ../bundles/ \; || true
          # macOS
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -exec cp {} ../bundles/ \; || true
          # Windows
          find src-tauri/target -type f \( -name '*.msi' -o -name '*.msi.zip' -o -name '*.msi.zip.sig' -o -name '*-setup.exe' -o -name '*-setup.nsis.zip' -o -name '*-setup.nsis.zip.sig' \) -exec cp {} ../bundles/ \; || true

      - name: Package Windows portable (lite)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = "src-tauri\target\release\noteriv.exe"
          if (-not (Test-Path $exe)) { throw "noteriv.exe not found at $exe" }
          $stage = Join-Path $env:RUNNER_TEMP "noteriv-portable"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item $exe (Join-Path $stage "noteriv.exe")
          Set-Content -Path (Join-Path $stage "portable.txt") -Value "Marker file. Triggers portable mode: all settings, vaults, and cache stay in this folder."
          @"
          Noteriv $version - Portable

          Run noteriv.exe. All settings and data live in the 'data' folder
          next to the EXE. Auto-updates are disabled in portable builds.
          Delete portable.txt to switch back to standard (AppData) mode.
          "@ | Set-Content -Path (Join-Path $stage "README.txt")
          $zip = "..\bundles\Noteriv-$version-windows-x64-portable.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: bundles/

  # Sideloadable APK built with EAS using the project's stored Android
  # credentials. Requires an EXPO_TOKEN secret; skipped until it is set, and
  # a failure here never blocks the desktop release.
  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: phone
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check for Expo token
        id: token
        working-directory: .
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXPO_TOKEN secret not set; skipping APK build."
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: phone/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.token.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm deps
        if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: Build APK
        if: steps.token.outputs.present == 'true'
        run: |
          VERSION=$(node -p "require('../desktop/package.json').version")
          mkdir -p ../bundles
          npx --yes eas-cli@latest build --platform android --profile apk --local \
            --non-interactive --output "../bundles/Noteriv-${VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        if: steps.token.outputs.present == 'true'
        with:
          name: bundles-android
          path: bundles/

  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: bundles/
          merge-multiple: true

      - name: Generate latest.json
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          PUBDATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          read_sig() { [ -f "$1" ] && cat "$1" || echo ""; }

          LINUX_FILE=$(ls bundles/*.AppImage 2>/dev/null | head -1 || true)
          LINUX_SIG=$([ -n "$LINUX_FILE" ] && read_sig "${LINUX_FILE}.sig" || echo "")
          MAC_FILE=$(ls bundles/*.app.tar.gz 2>/dev/null | head -1 || true)
          MAC_SIG=$([ -n "$MAC_FILE" ] && read_sig "${MAC_FILE}.sig" || echo "")
          WIN_FILE=$(ls bundles/*-setup.nsis.zip 2>/dev/null | head -1 || ls bundles/*.msi.zip 2>/dev/null | head -1 || true)
          WIN_SIG=$([ -n "$WIN_FILE" ] && read_sig "${WIN_FILE}.sig" || echo "")

          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          cat > bundles/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See release notes on GitHub.",
            "pub_date": "${PUBDATE}",
            "platforms": {
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${BASE_URL}/$(basename "${LINUX_FILE:-noop}")"
              },
              "darwin-x86_64": {
                "signature": "${MAC_SIG}",
                "url": "${BASE_URL}/$(basename "${MAC_FILE:-noop}")"
              },
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "${BASE_URL}/$(basename "${MAC_FILE:-noop}")"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${BASE_URL}/$(basename "${WIN_FILE:-noop}")"
              }
            }
          }
          EOF
          echo "--- latest.json ---"
          cat bundles/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bundles/*.AppImage
            bundles/*.AppImage.sig
            bundles/*.deb
            bundles/*.rpm
            bundles/*.dmg
            bundles/*.app.tar.gz
            bundles/*.app.tar.gz.sig
            bundles/*-setup.exe
            bundles/*-setup.nsis.zip
            bundles/*-setup.nsis.zip.sig
            bundles/*.msi
            bundles/*.msi.zip
            bundles/*.msi.zip.sig
            bundles/Noteriv-*-windows-x64-portable.zip
            bundles/Noteriv-*-android.apk
            bundles/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tell the self-hosted Flatpak repo to rebuild for this version.
      # Requires a PAT secret FLATPAK_DISPATCH_TOKEN (classic, 'repo' scope) and
      # the flatpak repo at thejacedev/flatpak. Safe no-op until set up.
      - name: Trigger Flatpak repo rebuild
        continue-on-error: true
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.FLATPAK_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/thejacedev/flatpak/dispatches" \
            -d "{\"event_type\":\"noteriv-release\",\"client_payload\":{\"version\":\"${GITHUB_REF_NAME#v}\"}}"
